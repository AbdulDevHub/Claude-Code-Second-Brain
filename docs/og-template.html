<!doctype html><html><head><!-- Source for docs/og-image.png: open over http at 1200x630 and screenshot. --><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#000;overflow:hidden;font-family:Outfit,sans-serif;color:#f4ece6;position:relative}
.orb{position:absolute;inset:0;background:url(screenshots/hero.png) 222px -126px/1296px 810px no-repeat;
 -webkit-mask-image:radial-gradient(circle 400px at 870px 318px,#000 70%,transparent 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 72% 52%,rgba(255,106,43,.16),transparent 45%)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#000 38%,rgba(0,0,0,.7) 50%,transparent 62%)}
.copy{position:absolute;left:72px;top:70px;width:600px}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{width:58px;height:58px;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,106,43,.65))}
.brand h1{font:300 34px/1 Outfit;letter-spacing:.24em;color:#e9e0da}
.brand h1 b{font-weight:800;letter-spacing:.1em;color:#fff;margin-right:.18em}
.kicker{margin-top:14px;margin-left:76px;font:700 13px/1 Outfit;letter-spacing:.3em;color:#ff6a2b}
h2{margin-top:62px;font:600 58px/1.06 Outfit;letter-spacing:-.01em;color:#fff}
h2 em{font-style:normal;background:linear-gradient(90deg,#ffb347,#ff6a2b 55%,#ff3b30);-webkit-background-clip:text;color:transparent}
p{margin-top:22px;font:400 22px/1.4 Outfit;color:#9a8b80;width:520px}
.chips{position:absolute;left:72px;bottom:64px;display:flex;gap:10px}
.chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:8px;padding:9px 14px;font:500 12.5px/1 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:#f4ece6}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:1px}
</style></head><body>
<div class="orb"></div><div class="glow"></div><div class="fade"></div>
<div class="copy">
 <div class="brand"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs>
  <circle cx="24" cy="24" r="23" fill="none" stroke="#ff6a2b" stroke-opacity=".35" stroke-dasharray="2 5"/>
  <polygon points="24,4 41.3,14 41.3,34 24,44 6.7,34 6.7,14" fill="none" stroke="url(#lg)" stroke-width="2.4"/>
  <g stroke="#ffb98f" stroke-width="1" stroke-opacity=".7"><line x1="24" y1="24" x2="15" y2="16"/><line x1="24" y1="24" x2="33.5" y2="17"/><line x1="24" y1="24" x2="31" y2="32.5"/><line x1="24" y1="24" x2="15.5" y2="31.5"/></g>
  <circle cx="15" cy="16" r="2" fill="#ff6a2b"/><circle cx="33.5" cy="17" r="2" fill="#ffb347"/><circle cx="31" cy="32.5" r="2" fill="#3aa0ff"/><circle cx="15.5" cy="31.5" r="2" fill="#ff3b30"/><circle cx="24" cy="24" r="4" fill="#fff"/></svg>
  <h1><b>SECOND</b> BRAIN</h1></div>
 <div class="kicker">FOR CLAUDE CODE</div>
 <h2>See everything Claude Code <em>knows about you.</em></h2>
 <p>Your memories, notes, skills, plugins, MCP servers and agents as a living 3D map.</p>
</div>
<div class="chips"><span class="chip"><i style="background:#ff6a2b"></i>3D orb</span><span class="chip"><i style="background:#3aa0ff"></i>2D maps</span><span class="chip"><i style="background:#ffb347"></i>Timeline</span><span class="chip"><i style="background:#5dff9b"></i>No dependencies</span></div>
</body></html>
